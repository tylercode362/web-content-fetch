services:
  web-content-fetch:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${WEB_CONTENT_FETCH_PIDS_LIMIT:-256}
    mem_limit: ${WEB_CONTENT_FETCH_MEMORY_LIMIT:-1g}
    mem_reservation: ${WEB_CONTENT_FETCH_MEMORY_RESERVATION:-256m}
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${WEB_CONTENT_FETCH_PORT:-8092}:8092"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WEB_CONTENT_FETCH_BIND_HOST: 0.0.0.0
      WEB_CONTENT_FETCH_PORT: 8092
      WEB_CONTENT_FETCH_STATE_DIR: /var/lib/web-content-fetch/state
      WEB_CONTENT_FETCH_OUTPUT_DIR: /var/lib/web-content-fetch/output
      WEB_CONTENT_FETCH_BRIDGE_URL: ${WEB_CONTENT_FETCH_BRIDGE_URL:?required}
      WEB_CONTENT_FETCH_BRIDGE_SERVICE_ID: ${WEB_CONTENT_FETCH_BRIDGE_SERVICE_ID:-web-content-fetch}
      WEB_CONTENT_FETCH_CALLBACK_URL: ${WEB_CONTENT_FETCH_CALLBACK_URL:-http://host.docker.internal:8092/api/bridge/callback}
      WEB_CONTENT_FETCH_CALLBACK_ALLOWED_HOSTS: ${WEB_CONTENT_FETCH_CALLBACK_ALLOWED_HOSTS:-host.docker.internal,web-content-fetch}
      WEB_CONTENT_FETCH_CALLBACK_PROXY_ORIGINS: ${WEB_CONTENT_FETCH_CALLBACK_PROXY_ORIGINS:-}
      WEB_CONTENT_FETCH_MAX_CONCURRENT_JOBS: ${WEB_CONTENT_FETCH_MAX_CONCURRENT_JOBS:-5}
      WEB_CONTENT_FETCH_KOBO_MAX_WIDTH: ${WEB_CONTENT_FETCH_KOBO_MAX_WIDTH:-1404}
      WEB_CONTENT_FETCH_KOBO_MAX_HEIGHT: ${WEB_CONTENT_FETCH_KOBO_MAX_HEIGHT:-1872}
    volumes:
      - web_content_fetch_state:/var/lib/web-content-fetch/state
      - web_content_fetch_output:/var/lib/web-content-fetch/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  openspec:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    init: true
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    mem_reservation: 64m
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      OPENSPEC_TELEMETRY: "0"
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    entrypoint: ["/opt/openspec/node_modules/.bin/openspec"]
    command: ["--version"]

volumes:
  web_content_fetch_state:
  web_content_fetch_output:
